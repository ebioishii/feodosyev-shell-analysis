[project]
name = "feodosyev-shell-analysis"
version = "0.1.0"
description = "Research tools for Feodosyev Chapter 9 Section 9.3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "scipy>=1.14",
]

[tool.setuptools]
py-modules = [
    "feodosyev_diagnostics",
    "feodosyev_curve",
    "feodosyev_single_point",
    "heat_then_pressurize",
    "interpolation",
    "known_initial_pressurize",
]
