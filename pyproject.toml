[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "feodosyev-shell-analysis"
version = "0.3.0"
description = "Traceable material curves for regenerative cooling structural research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "plotly>=6,<7", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jupyterlab>=4,<5", "ipykernel>=6,<8", "nbconvert>=7,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/feodosyev_shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
